# netlify.toml
# Drop this file in the root of your repo.
# Netlify reads it automatically on deploy.

[build]
  # The folder containing your HTML/CSS/JS files.
  # If your frontend is in a subfolder change this, e.g. publish = "frontend"
  publish = "."

  # No build step needed — pure static files.
  # If you add a bundler (Vite, Webpack etc.) later, set command here.
  command = ""

# ── Redirect all unknown paths to index.html (SPA fallback) ──
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Cache static assets aggressively ─────────────────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"