# render.yaml — Blueprint deploy config
# Steps:
#   1. Push this repo to GitHub
#   2. render.com → New → Blueprint → connect repo
#   3. Render reads this file, creates the web service + DB automatically
#   4. After first deploy: go to the Render shell → node -e "require('./server.js')"
#      or just open the URL — server auto-creates the data/ directory

services:
  - type: web
    name: nexus-api
    runtime: node
    plan: free                       # upgrade to starter ($7/mo) for always-on
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /api/signal

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString

      # After first deploy, Render gives you a URL like:
      # https://nexus-api.onrender.com
      # Update this to match your actual service URL
      - key: ALLOWED_ORIGINS
        value: "https://nexus-api-khvt.onrender.com"

      - key: NEXUS_SECRET
        value: "1635b7dc40f7264b243ea3daaa64f8371a849c296dbc70e4e63456b4825fb52f"

      - key: NODE_ENV
        value: production

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus_user