<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | Market</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* ── Market page layout ── */
        #market-page {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            gap: 8px;
            min-height: 0;
        }
        .market-card {
            background: var(--surface-white);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .market-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px 8px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        .market-card-title {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .market-card-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }

        /* ── Watchlist rows ── */
        .watch-row {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background 0.15s;
        }
        .watch-row:last-child { border-bottom: none; }
        .watch-row:hover { background: rgba(100,130,200,0.05); }
        .watch-row.active { background: rgba(100,130,200,0.08); }
        .watch-sym {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .watch-name {
            font-size: 0.60rem;
            color: var(--text-muted);
            margin-top: 1px;
        }
        .watch-price {
            font-size: 0.78rem;
            font-weight: 600;
            font-family: 'SF Mono', monospace;
            color: var(--text-primary);
            text-align: right;
            min-width: 90px;
        }
        .watch-change {
            font-size: 0.65rem;
            font-family: 'SF Mono', monospace;
            font-weight: 600;
            text-align: right;
            min-width: 62px;
        }
        .watch-change.pos { color: var(--accent2); }
        .watch-change.neg { color: var(--accent3); }
        .watch-spread {
            font-size: 0.60rem;
            color: var(--text-muted);
            font-family: 'SF Mono', monospace;
            text-align: right;
            min-width: 48px;
        }

        /* ── Price flash ── */
        @keyframes flash-up   { 0%,100%{background:transparent} 50%{background:rgba(52,211,153,0.18)} }
        @keyframes flash-down { 0%,100%{background:transparent} 50%{background:rgba(239,68,68,0.18)} }
        .flash-up   { animation: flash-up   0.4s ease; }
        .flash-down { animation: flash-down 0.4s ease; }

        /* ── Live ticker bar ── */
        #ticker-bar {
            grid-column: 1 / -1;
            background: var(--surface-white);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-sm);
            padding: 0 14px;
            display: flex;
            align-items: center;
            gap: 24px;
            overflow: hidden;
            height: 44px;
            flex-shrink: 0;
        }
        .ticker-item {
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .ticker-sym  { font-size:0.62rem; font-weight:700; color:var(--text-muted); letter-spacing:0.06em; }
        .ticker-price { font-size:0.72rem; font-weight:600; font-family:'SF Mono',monospace; color:var(--text-primary); }
        .ticker-chg  { font-size:0.62rem; font-weight:600; font-family:'SF Mono',monospace; }
        .ticker-chg.pos { color:var(--accent2); }
        .ticker-chg.neg { color:var(--accent3); }
        .ticker-sep { color:var(--border-light); font-size:0.8rem; }

        /* ── Detail panel ── */
        #market-detail {
            grid-column: 2;
            grid-row: 2;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 12px 14px;
        }
        .detail-stat { display: flex; flex-direction: column; gap: 2px; }
        .detail-stat-label { font-size:0.58rem; color:var(--text-muted); letter-spacing:0.06em; text-transform:uppercase; }
        .detail-stat-value { font-size:0.80rem; font-weight:600; font-family:'SF Mono',monospace; color:var(--text-primary); }

        /* ── Category tabs ── */
        .cat-tabs {
            display: flex;
            gap: 4px;
            padding: 0 14px 0;
        }
        .cat-tab {
            font-size: 0.58rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }
        .cat-tab.active, .cat-tab:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ── Connection badge ── */
        .ws-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.58rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .ws-badge .dot { width:6px; height:6px; border-radius:50%; background:var(--accent3); }
        .ws-badge.live .dot { background:var(--accent2); }

        @media (max-width: 768px) {
            #market-page { grid-template-columns: 1fr; }
            #market-detail { grid-column: 1; grid-row: auto; }
        }
    </style>
</head>
<body>

<canvas id="wave-canvas"></canvas>

<div id="app-shell">
    <div id="nexus-nav"></div>

    <div id="main-content">
        <div id="nexus-header"></div>

        <div id="market-page">

            <!-- ── TICKER BAR ── -->
            <div id="ticker-bar">
                <span class="market-card-title" style="white-space:nowrap;flex-shrink:0;">LIVE FEED</span>
                <div id="ticker-items" style="display:flex;gap:24px;overflow:hidden;flex:1;"></div>
                <div id="ws-badge" class="ws-badge" style="flex-shrink:0;">
                    <div class="dot"></div>
                    <span id="ws-label">Connecting…</span>
                </div>
            </div>

            <!-- ── WATCHLIST ── -->
            <div class="market-card" style="grid-row:2;grid-column:1;">
                <div class="market-card-header">
                    <span class="market-card-title">Watchlist</span>
                    <div class="cat-tabs" id="cat-tabs">
                        <button class="cat-tab active" data-cat="synthetic">Synthetic</button>
                        <button class="cat-tab" data-cat="forex">Forex</button>
                        <button class="cat-tab" data-cat="crypto">Crypto</button>
                        <button class="cat-tab" data-cat="metals">Metals</button>
                    </div>
                </div>
                <div id="watchlist-header" style="display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:4px 14px 4px;border-bottom:1px solid var(--border-light);">
                    <span style="font-size:0.58rem;color:var(--text-muted);letter-spacing:0.06em;">SYMBOL</span>
                    <span style="font-size:0.58rem;color:var(--text-muted);letter-spacing:0.06em;text-align:right;min-width:90px;">PRICE</span>
                    <span style="font-size:0.58rem;color:var(--text-muted);letter-spacing:0.06em;text-align:right;min-width:62px;">CHANGE</span>
                    <span style="font-size:0.58rem;color:var(--text-muted);letter-spacing:0.06em;text-align:right;min-width:48px;">SPREAD</span>
                </div>
                <div id="watchlist-body" class="market-card-body"></div>
            </div>

            <!-- ── DETAIL PANEL ── -->
            <div class="market-card" id="market-detail">
                <div class="market-card-header">
                    <span class="market-card-title" id="detail-title">Select a symbol</span>
                    <span id="detail-badge" class="ws-badge"></span>
                </div>
                <div class="detail-grid">
                    <div class="detail-stat">
                        <div class="detail-stat-label">Last Price</div>
                        <div class="detail-stat-value" id="d-price">—</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-label">Bid / Ask</div>
                        <div class="detail-stat-value" id="d-bidask">—</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-label">Day High</div>
                        <div class="detail-stat-value" id="d-high" style="color:var(--accent2)">—</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-label">Day Low</div>
                        <div class="detail-stat-value" id="d-low" style="color:var(--accent3)">—</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-label">Open</div>
                        <div class="detail-stat-value" id="d-open">—</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-label">Change %</div>
                        <div class="detail-stat-value" id="d-change">—</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-label">Spread (pts)</div>
                        <div class="detail-stat-value" id="d-spread">—</div>
                    </div>
                    <div class="detail-stat">
                        <div class="detail-stat-label">Tick Count (1m)</div>
                        <div class="detail-stat-value" id="d-ticks">—</div>
                    </div>
                </div>

                <div style="padding:0 14px 10px;">
                    <div class="market-card-title" style="margin-bottom:6px;">Recent Ticks</div>
                    <div id="tick-tape" style="font-family:'SF Mono',monospace;font-size:0.68rem;color:var(--text-sub);height:80px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:2px;"></div>
                </div>

                <div style="padding:0 14px 14px;">
                    <button id="btn-trade-this" class="btn-pro" style="width:100%;font-size:0.65rem;padding:9px;">
                        ▶ Open on Terminal
                    </button>
                </div>
            </div>

        </div><!-- /market-page -->
    </div>
</div>

<script type="module" src="js/nav.js"></script>

    import { Market } from './js/pages/market.js';
    document.addEventListener('DOMContentLoaded', () => Market.init());
</script>

</body>
</html>
